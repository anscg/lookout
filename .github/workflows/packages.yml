name: Publish package repositories

# Publishes both repositories to pkg.lookout.hackclub.com via Pages:
#   /deb  flat apt repository
#   /rpm  dnf repository
#
# Sources every package from the GitHub releases rather than from a build, so
# it runs in a couple of minutes and can be fired by hand at any time --
# getting a repository up, or repairing one, does not require cutting a tag.
#
# A Pages deploy replaces the whole site, so both repositories are rebuilt
# every run. They cannot be published independently.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (blank = the newest published release)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: pkg-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      KEEP: "5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install repository tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c rpm

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is not set. Run scripts/apt-keygen.sh and add the secrets." >&2
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          echo "SIGNING_FPR=$fpr" >> "$GITHUB_ENV"
          echo "signing with $fpr"

      - name: Collect packages from the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p repo/deb/pool repo/rpm

          grab() {
            gh release download "$1" --dir repo/deb/pool --pattern '*.deb' --clobber || return 1
            gh release download "$1" --dir repo/rpm --pattern '*.rpm' --clobber || true
          }

          # A tag passed in is taken even if its release is still a draft --
          # release.yml creates drafts, and the repositories have to advertise
          # the version that was just built.
          if [ -n "${TAG:-}" ]; then
            echo "including $TAG"
            grab "$TAG"
          fi

          # Older versions stay in the pool so that an index someone cached
          # before this release still points at a .deb that exists, and so
          # `apt install lookout=<version>` keeps working.
          want="$KEEP"
          [ -n "${TAG:-}" ] && want=$((KEEP - 1))
          gh release list --limit 50 --exclude-drafts --json tagName -q '.[].tagName' \
            | grep -v "^${TAG:-}$" | head -n "$want" | while read -r t; do
                echo "including $t"
                grab "$t" || echo "  (no .deb assets on $t -- skipping)"
              done

          if [ -z "$(ls -A repo/deb/pool)" ]; then
            echo "::error::No .deb assets found on any release -- nothing to publish." >&2
            exit 1
          fi
          echo "deb pool: $(ls repo/deb/pool | wc -l) files, $(du -sh repo/deb/pool | cut -f1)"
          echo "rpm pool: $(ls repo/rpm | wc -l) files, $(du -sh repo/rpm | cut -f1)"

      # Signing with a key whose public half isn't the one a .deb installs makes
      # every enrolled machine fail apt update with NO_PUBKEY, and the fix can't
      # be delivered through apt. Releases from before the keyring shipped carry
      # no key at all, which is fine -- they just never enrolled anyone.
      - name: Verify shipped keyrings match the signing key
        run: |
          set -euo pipefail
          checked=0
          for deb in repo/deb/pool/*.deb; do
            if ! dpkg-deb --fsys-tarfile "$deb" \
                 | tar -xO ./usr/share/lookout/lookout-archive-keyring.asc > shipped.asc 2>/dev/null; then
              echo "$(basename "$deb"): no keyring (predates enrollment) -- skipped"
              continue
            fi
            fpr=$(gpg --batch --with-colons --show-keys shipped.asc | awk -F: '/^fpr:/ {print $10; exit}')
            if [ "$fpr" != "$SIGNING_FPR" ]; then
              echo "::error::$(basename "$deb") ships key $fpr, but the repository is signed by $SIGNING_FPR. Publishing this would make apt update fail on every enrolled machine." >&2
              exit 1
            fi
            echo "$(basename "$deb"): key matches"
            checked=$((checked + 1))
          done
          echo "$checked package(s) carried a keyring, all matching"

      - name: Build the apt repository
        run: |
          set -euo pipefail
          cd repo/deb
          # One index for every arch and kept version; apt filters on each
          # entry's Architecture and picks the highest Version.
          dpkg-scanpackages --multiversion pool > Packages
          gzip -9kf Packages
          xz -9kf Packages
          # After the compressed indices exist -- Release carries their hashes.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Lookout \
            -o APT::FTPArchive::Release::Label=Lookout \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            release . > Release
          echo "--- Release ---"; cat Release
          echo "--- indexed ---"; grep -E '^(Package|Version|Architecture|Filename):' Packages

      - name: Sign the apt index
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd repo/deb
          # InRelease is what modern apt fetches; Release.gpg for older clients.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" \
              --local-user "$SIGNING_FPR" --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" \
              --local-user "$SIGNING_FPR" -abs -o Release.gpg Release
          # Verify with only the public half, the way a client would.
          gpg --batch --armor --export "$SIGNING_FPR" > pub.asc
          rm -rf verify && mkdir verify && chmod 700 verify
          GNUPGHOME=verify gpg --batch --quiet --import pub.asc
          GNUPGHOME=verify gpg --batch --verify InRelease
          rm -rf verify pub.asc

      # dnf checks signatures on the packages themselves, not only on the
      # metadata, so gpgcheck=1 in the .repo file needs every rpm signed. They
      # arrive off the releases unsigned.
      - name: Sign the rpms and build the dnf repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A repo/rpm)" ]; then
            echo "no .rpm assets on any release -- publishing the apt repository only"
            rmdir repo/rpm
            exit 0
          fi
          pass=$(mktemp); printf '%s' "$APT_GPG_PASSPHRASE" > "$pass"
          trap 'shred -u "$pass" 2>/dev/null || rm -f "$pass"' EXIT
          rpmsign \
            --define "_gpg_name $SIGNING_FPR" \
            --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $pass" \
            --addsign repo/rpm/*.rpm

          # Read the signature back with only the public half, the way a
          # client does -- rpmsign reports success on things dnf then rejects.
          gpg --batch --armor --export "$SIGNING_FPR" > pub.asc
          rpmkeys --import pub.asc
          for r in repo/rpm/*.rpm; do
            rpmkeys --checksig "$r" | grep -q "signatures OK" \
              || { echo "::error::$(basename "$r") is not verifiably signed" >&2; exit 1; }
          done
          rm pub.asc
          echo "signed and verified $(ls repo/rpm/*.rpm | wc -l) rpm(s)"

          createrepo_c --quiet repo/rpm
          # repo_gpgcheck=1 verifies this detached signature over the metadata.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" \
              --local-user "$SIGNING_FPR" --detach-sign --armor repo/rpm/repodata/repomd.xml
          echo "dnf repository built"

      - name: Render the homepage
        run: |
          set -euo pipefail
          # The root would 404 otherwise, which is the first thing anyone
          # pasting the hostname sees.
          version=$(grep -m1 '^Version:' repo/deb/Packages | awk '{print $2}')
          fpr=$(gpg --fingerprint --with-colons "$SIGNING_FPR" \
                | awk -F: '/^fpr:/ {print $10; exit}' \
                | sed 's/.\{4\}/& /g; s/ $//')
          sed -e "s/@VERSION@/$version/g" -e "s/@FINGERPRINT@/$fpr/g" \
            packaging/pkg-site/index.html > repo/index.html
          grep -q '@VERSION@\|@FINGERPRINT@' repo/index.html \
            && { echo "::error::unsubstituted placeholder left in the homepage" >&2; exit 1; } || true
          echo "homepage rendered for $version"

      - name: Add Pages metadata
        run: |
          echo pkg.lookout.hackclub.com > repo/CNAME
          # One key signs both repositories; served at the root so the install
          # docs have a single URL to point at.
          cp clients/desktop/src-tauri/linux/lookout-archive-keyring.asc repo/
          # Redundant for an Actions deploy, which serves files as-is; kept in
          # case the Pages source is ever switched back to a branch.
          touch repo/.nojekyll
          find repo -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v4
