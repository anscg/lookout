name: Publish AUR package

# Pushes lookout-bin to the AUR, so Arch users get updates through paru/yay
# like any other package.
#
# The .deb is the source: it already carries the built binary, the desktop file
# and the icons, so the PKGBUILD repackages it rather than duplicating the
# layout. Everything comes off the GitHub release, so this can be run by hand
# at any time.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (blank = the newest published release)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve the release and hash its packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          fi
          test -n "$tag"
          version="${tag#v}"
          echo "publishing $tag as $version"

          mkdir -p dl
          gh release download "$tag" --dir dl --pattern '*_amd64.deb' --clobber
          gh release download "$tag" --dir dl --pattern '*_arm64.deb' --clobber

          # The PKGBUILD names its sources by the exact release-asset filename,
          # so a rename upstream has to fail here rather than produce a package
          # that 404s for every Arch user.
          test -f "dl/Lookout_linux-${version}_amd64.deb"
          test -f "dl/Lookout_linux-${version}_arm64.deb"

          {
            echo "VERSION=$version"
            echo "SHA_X86_64=$(sha256sum "dl/Lookout_linux-${version}_amd64.deb" | cut -d' ' -f1)"
            echo "SHA_AARCH64=$(sha256sum "dl/Lookout_linux-${version}_arm64.deb" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Render the PKGBUILD and .SRCINFO
        run: |
          set -euo pipefail
          mkdir -p aur
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA256_X86_64@/$SHA_X86_64/g" \
              -e "s/@SHA256_AARCH64@/$SHA_AARCH64/g" \
              packaging/aur/PKGBUILD.in > aur/PKGBUILD
          grep -q '@' aur/PKGBUILD && { echo "::error::unsubstituted placeholder left in PKGBUILD" >&2; exit 1; } || true

          # .SRCINFO is what the AUR actually indexes, and only makepkg can
          # produce it -- a hand-written one drifts from the PKGBUILD silently.
          docker run --rm -v "$PWD/aur:/pkg" -w /pkg archlinux:base-devel bash -euc '
            useradd -m build
            chown -R build /pkg
            su build -c "makepkg --printsrcinfo" > /pkg/.SRCINFO
          '
          echo "--- PKGBUILD ---"; cat aur/PKGBUILD
          echo "--- .SRCINFO ---"; cat aur/.SRCINFO

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # Published at https://aur.archlinux.org/ under "SSH host keys".
          # Pinned rather than trust-on-first-use; a mismatch fails the job
          # closed, which is the safe direction.
          AUR_HOST_KEY_FPR: "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set. See docs/linux.md for the one-time AUR setup." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          got=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$got" != "$AUR_HOST_KEY_FPR" ]; then
            echo "::error::aur.archlinux.org host key is $got, expected $AUR_HOST_KEY_FPR. Refusing to push. If the AUR rotated its key, update AUR_HOST_KEY_FPR after checking the published value." >&2
            exit 1
          fi

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/lookout-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          if git diff --quiet; then
            echo "AUR already has $VERSION -- nothing to push"
            exit 0
          fi
          git -c user.name="Hack Club" -c user.email="lookout@hackclub.com" \
              commit -am "lookout-bin $VERSION"
          git push
          echo "pushed lookout-bin $VERSION to the AUR"
